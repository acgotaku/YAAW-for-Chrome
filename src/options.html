<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YAAW for Chrome Settings</title>
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, width=device-width">
    <link href="yaaw/img/favicon.ico" rel="shortcut icon" type="image/ico" />
    <link href="yaaw/css/bootstrap.min.css" rel="stylesheet" />
    <link href="yaaw/css/bootstrap-responsive.min.css" rel="stylesheet" />
    <link href="css/options.css" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <nav class="navbar">
          <div class="container">
            <div class="logo"></div>
          </div>
      </nav>
      <div class="container">
        <div class="form-horizontal">
          <fieldset>
            <legend>
              <h1 class="title" id="title"></h1>
              <span class="version" id="version"></span>
              <span class="config-saved" id="config-saved"></span>
            </legend>
            <div class="control-group">
              <label class="control-label" for="contextMenus" id="label-contextMenus"></label>
              <div class="controls">
                <label class="checkbox">
                  <input type="checkbox" id="contextMenus">
                  <span id="contextMenuDesc"></span>
                </label>
              </div>
            </div>
            <div class="control-group">
              <label class="control-label" for="autoRename" id="label-autoRename"></label>
              <div class="controls">
                <label class="checkbox">
                  <input type="checkbox" id="autoRename">
                  <span id="autoRenameDesc"></span>
                </label>
              </div>
            </div>
            <div class="control-group">
              <label class="control-label" for="syncConfig" id="label-syncConfig"></label>
              <div class="controls">
                <label class="checkbox">
                  <input type="checkbox" id="syncConfig">
                  <span id="syncConfigDesc"></span>
                </label>
              </div>
            </div>
            <div class="control-group">
              <label class="control-label" for="interception" id="label-interception"></label>
              <div class="controls">
                <label class="checkbox">
                  <input type="checkbox" id="interception" class="interception">
                  <span id="interceptionDesc"></span> &nbsp;&nbsp;&nbsp; <span id="fileSizeStr"></span> &gt;=
                  <input type="number" class="input-small" placeholder="File Size" id="fileSize">
                  （<span id="unit"></span>：M）
                </label>
              </div>
            </div>
            <div class="control-group">
              <label class="control-label" for="downloadPath" id="label-downloadPath"></label>
              <div class="controls">
                <input type="text" class="input-xlarge" id="downloadPath">
                &nbsp;&nbsp;&nbsp; <span id="downloadPathDesc"></span>
              </div>
            </div>
            <div id="rpc-list"></div>
            <div class="control-group">
              <label class="control-label" for="whitelist" id="label-whitelist"></label>
              <div class="controls">
                <textarea rows="6" id="whitelist"></textarea>
              </div>
            </div>
            <div class="control-group">
              <label class="control-label" for="blocklist" id="label-blocklist"></label>
              <div class="controls">
                <textarea rows="6" id="blocklist"></textarea>
              </div>
            </div>
          </fieldset>
        </div>
      </div>
      <footer class="footer">
        <div class="container">
            <div class="modal-footer">
              <div class="copyright">© Copyright <a href="https://github.com/acgotaku/YAAW-for-Chrome" target="_blank">雪月秋水</a></div>
              <button type="button" class="btn btn-success" id="btn-save"></button>
              <button type="button" class="btn" id="btn-reset"></button>
            </div>
        </div>
      </footer>
    </div>
    <script src="yaaw/js/jquery-1.7.2.min.js"></script>
    <script src="yaaw/js/bootstrap.min.js"></script>
    <script src="js/options.js"></script>
  </body>
</html>
